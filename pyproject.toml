[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "es-finetuning"
version = "0.1.0"
description = "Evolution Strategies fine-tuning library for LLMs"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["es_finetuning*"]
